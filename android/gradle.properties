# Gradle JVM Home
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

# Gradle Memory & Performance settings with Module Reflection Opens for Java 17+
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX & Build Settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Flutter migration flags
android.builtInKotlin=false
android.newDsl=false
